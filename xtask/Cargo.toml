[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
description = "Maintenance tasks for cxvm: generating the toolchain catalog"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1.1.6"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "json"] }

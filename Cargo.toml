[package]
name = "cxvm"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.89"
description = "Per-project C/C++ compiler versions for x86_64 Linux"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["gcc", "clang", "toolchain", "version-manager", "cmake"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive", "wrap_help"] }
clap_complete = "4.6"
thiserror = "2.0"

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"

[profile.release]
lto = true
codegen-units = 1
strip = true

[package]
name = "cxvm"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.89"
description = "Per-project C/C++ compiler versions for x86_64 Linux"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["gcc", "clang", "toolchain", "version-manager", "cmake"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[workspace]
members = ["xtask"]

[dependencies]
bzip2 = "0.6"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
clap_complete = "4.6"
flate2 = "1.1"
indicatif = "0.18"
liblzma = { version = "0.4", default-features = false, features = ["static"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tar = { version = "0.4", default-features = false }
thiserror = "2.0"
toml = "1.1"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.27"

[profile.release]
lto = true
codegen-units = 1
strip = true

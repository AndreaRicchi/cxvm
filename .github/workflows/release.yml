name: Release

# Pushing a tag v<version> runs CI and turns its musl archive into a draft
# GitHub release, with the notes from CHANGELOG.md. Publishing the draft and
# `cargo publish` are done by hand.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: draft the GitHub release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      ARCHIVE: cxvm-x86_64-unknown-linux-musl.tar.gz
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: cxvm-x86_64-unknown-linux-musl
          path: dist
      - name: Check the archive is the tagged version
        run: |
          cd dist
          sha256sum -c "$ARCHIVE.sha256"
          tar -xzf "$ARCHIVE"
          actual=$("${ARCHIVE%.tar.gz}/cxvm" --version)
          rm -r "${ARCHIVE%.tar.gz}"
          if [ "$actual" != "cxvm ${TAG#v}" ]; then
            echo "::error::the tag is $TAG but the binary says '$actual': set the version in Cargo.toml and tag again"
            exit 1
          fi
      - name: Take the release notes from CHANGELOG.md
        run: |
          awk -v heading="## [${TAG#v}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section '## [${TAG#v}]': add one and tag again"
            exit 1
          fi
      # GitHub attests private repositories only on Enterprise Cloud.
      - uses: actions/attest-build-provenance@v4
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: dist/${{ env.ARCHIVE }}
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --draft --verify-tag \
            --title "cxvm ${TAG#v}" --notes-file notes.md \
            "dist/$ARCHIVE" "dist/$ARCHIVE.sha256" install.sh
